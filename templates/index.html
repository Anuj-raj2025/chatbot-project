<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopEasy Support Chatbot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="chat">
    <header>
      <h1>🛍️ ShopEasy Support</h1>
      <div><a href="/logs">Logs</a><button id="reset">New chat</button></div>
    </header>
    <div id="messages"></div>
    <form id="form" autocomplete="off">
      <input id="input" type="text" placeholder="Type your question..." maxlength="300" required>
      <button type="submit">Send</button>
    </form>
  </div>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
